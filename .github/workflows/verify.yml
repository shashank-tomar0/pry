name: Verify

# WHY THIS EXISTS
#
# `typecheck`, `build` and `verify` were manual-only, and the repository's only
# workflow deployed the landing page. That is how a dead vision path (the egress
# evidence object was declared, tested and never produced) and proof markers that
# drift off their masks both survived a green test suite for as long as they did:
# nothing ran the tests, and the one test that covered the guard hand-built the
# object production could not produce.
#
# The suites assert the invariants that are expensive to lose:
#   - verify-pipeline: detection, tokenization, ledger integrity, egress
#     evidence, painted-box geometry, tier policy
#   - tripwire-test: the outbound PII interceptor
#   - ocr-test: real OCR over rendered fixtures (adversarial re-read)
#   - screenshot-egress-test: the guard, driven by the real evidence producers
#   - offscreen-integration-test: the offscreen redaction pipeline over real
#     pixels, through its real message listener

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, build and verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      # `npm ci` is the reproducible install, but it fails outright when the
      # lockfile has drifted from package.json — and a red pipeline for a
      # lockfile is worse than a slightly slower install, because it trains
      # people to ignore the job. Prefer `npm ci`, fall back to `npm install`.
      - name: Install dependencies
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # The suites bundle with esbuild and run under node. The OCR suite renders
      # fixtures and reads them back, so it needs the wasm/traineddata assets the
      # repo vendors, not a network download.
      - name: Verify
        run: npm run verify
