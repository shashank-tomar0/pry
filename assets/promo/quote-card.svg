    <text x="0" y="118" class="display" font-size="104" font-weight="700" fill="#15162b" letter-spacing="-1">agent shouldn&apos;t</text>
    <text x="0" y="236" class="display" font-size="104" font-weight="700" fill="#f36b57" letter-spacing="-1">read your credit</text>
    <text x="0" y="354" class="display" font-size="104" font-weight="700" fill="#f36b57" letter-spacing="-1">card.</text>
  </g>

  <!-- supporting line -->
  <g transform="translate(90, 940)">
    <rect x="0" y="0" width="6" height="150" fill="#1537ad"/>
    <text x="34" y="34" class="sans" font-size="30" fill="#15162b">PRY detects, tokenizes, and redacts your PII on-device</text>
    <text x="34" y="78" class="sans" font-size="30" fill="#15162b">before any screenshot or page text reaches an AI model.</text>
    <text x="34" y="122" class="mono" font-size="24" fill="#176a5e">VERHOEFF + LUHN GATED · RE-OCR VERIFIED · 0 KB WITH OLLAMA</text>
  </g>

