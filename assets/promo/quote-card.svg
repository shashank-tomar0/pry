  </defs>

  <rect width="1080" height="1350" fill="#f3ebe5"/>
  <rect width="1080" height="1350" fill="url(#dots)"/>

  <!-- top band -->
  <rect x="0" y="0" width="1080" height="14" fill="#1537ad"/>

  <!-- brand row -->
  <g transform="translate(90, 96)">
    <circle cx="12" cy="24" r="6" fill="#1537ad"/>
    <path d="M12 24C24 24 24 5 40 5s12 38 24 38S76 5 92 5s12 38 14 38" fill="none" stroke="#1537ad" stroke-width="4" stroke-linecap="round"/>
    <circle cx="122" cy="24" r="6" fill="#f36b57"/>
    <text x="160" y="30" class="mono" font-size="22" letter-spacing="6" fill="#0b1d63" font-weight="500">PRY — PRIVATE BROWSER AGENT</text>
  </g>

  <!-- headline -->
  <g transform="translate(90, 480)">
