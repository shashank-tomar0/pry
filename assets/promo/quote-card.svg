    <text x="0" y="48" class="mono" font-size="24" letter-spacing="3" fill="#0b1d63">FREE ON THE CHROME WEB STORE</text>
    <text x="0" y="92" class="mono" font-size="24" letter-spacing="3" fill="#15162b">pry.shashanktomar.dev</text>
